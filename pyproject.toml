[tool.poetry]
name = "atomic-habits"
version = "0.1.0"
description = ""
authors = ["nikita <hesoyame1998@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.32.3"
python-dotenv = "^1.1.0"
pandas = "^2.3.2"
openpyxl = "^3.1.5"
psycopg2 = "^2.9.11"
psycopg2-binary = "^2.9.11"
django = "^5.2.7"
pillow = "^12.0.0"
ipython = "^9.6.0"
redis = "^7.0.1"
djangorestframework = "^3.16.1"
django-filter = "^25.2"
djangorestframework-simplejwt = "^5.5.1"
coverage = "^7.11.3"
drf-yasg = "^1.21.11"
django-cors-headers = "^4.9.0"
stripe = "^13.2.0"
celery = "^5.5.3"
eventlet = "^0.40.3"
autopep8 = "^2.3.2"
django-celery-beat = "2.8.1"
django-timezone-field = "7.1"
whitenoise = "^6.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
types-requests = "^2.32.0.20250515"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.2"
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.15.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.isort]
line_length = 119

[tool.black]
line-length = 119
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | dist
)/
| foo.py
'''